<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Indirigible</title>
    <meta name="description" content="El Indirigible — Revista digital">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f2;
            color: #111;
        }

        header {
            padding: 35px 6%;
            border-bottom: 1px solid #d6d6d2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .tagline {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        main {
            max-width: 1250px;
            margin: auto;
            padding: 80px 6%;
        }

        .intro {
            max-width: 700px;
            margin-bottom: 70px;
        }

        .intro h1 {
            font-size: clamp(48px, 8vw, 92px);
            line-height: 0.9;
            letter-spacing: -5px;
            margin-bottom: 30px;
        }

        .intro p {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
            max-width: 580px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid #111;
            padding-bottom: 15px;
            margin-bottom: 35px;
        }

        .section-title h2 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .issues {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 35px;
        }

        .issue {
            background: white;
            padding-bottom: 25px;
        }

        .cover {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            margin-bottom: 22px;
        }

        .cover-content {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
        }

        .issue-info {
            padding: 0 20px;
        }

        .issue-number {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #777;
            margin-bottom: 8px;
        }

        .issue h3 {
            font-size: 24px;
            letter-spacing: -0.5px;
            margin-bottom: 18px;
        }

        .read-button {
            display: inline-block;
            color: #111;
            text-decoration: none;
            border-bottom: 1px solid #111;
            padding-bottom: 4px;
            font-size: 14px;
            font-weight: bold;
        }

        .read-button:hover {
            opacity: 0.5;
        }

        footer {
            margin-top: 100px;
            padding: 30px 6%;
            border-top: 1px solid #d6d6d2;
            display: flex;
            justify-content: space-between;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            header {
                display: block;
            }

            .tagline {
                margin-top: 8px;
            }

            main {
                padding-top: 55px;
            }

            .intro h1 {
                letter-spacing: -3px;
            }

            .issues {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 500px) {
            .issues {
                grid-template-columns: 1fr;
            }

            .intro {
                margin-bottom: 50px;
            }

            footer {
                display: block;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">El Indirigible</div>
    <div class="tagline">Revista digital</div>
</header>

<main>

    <section class="intro">
        <h1>El Indirigible</h1>

        <p>
            Revista de aventura, ciencia y cultura steampunk
        </p>
    </section>


    <section>

        <div class="section-title">
            <h2>Números</h2>
        </div>


        <div class="issues">

            <!-- NÚMERO 01 -->

            <article class="issue">

                <div class="cover">
                    <div class="cover-content">
                        EL<br>
                        INDIRIGIBLE<br><br>
                        Nº 01
                    </div>
                </div>

                <div class="issue-info">

                    <div class="issue-number">
                        Número 01 · Septiembre 2026
                    </div>

                    <h3>
                        Primera edición
                    </h3>

                    <a
                        class="read-button"
                        href="AQUI_EL_ENLACE_DE_GOOGLE_DRIVE"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        Leer número →
                    </a>

                </div>

            </article>

        </div>

    </section>

</main>


<footer>

    <span>
        © 2026 El Indirigible
    </span>

    <span>
        Revista digital
    </span>

</footer>

</body>
</html>
